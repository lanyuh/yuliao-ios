name: ios-build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 xcodegen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project Yuliao.xcodeproj \
            -scheme Yuliao \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打成 ipa
        run: |
          mkdir -p out/Payload
          cp -r build/Build/Products/Release-iphoneos/Yuliao.app out/Payload/
          cd out && zip -r Yuliao-unsigned.ipa Payload

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: Yuliao-unsigned-ipa
          path: out/Yuliao-unsigned.ipa
          if-no-files-found: error
